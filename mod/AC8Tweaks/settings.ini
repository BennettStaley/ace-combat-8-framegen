; AC8 Tweaks runtime settings. Everything here can also be changed in the in-game menu (F10).
; Edits to this file while the game runs apply within a second.
; Keys under [ConsoleVariables] are Unreal console variables. Any variable can be added.
; Startup-only variables (r.Streamline.InitializePlugin, r.Streamline.Load.*) belong in Engine.ini.
; state.ini next to this file shows what the engine currently reports.

[ConsoleVariables]
; DLSS frame generation: 0 off, 1 on, 2 auto
r.Streamline.DLSSG.Enable=1
; Generated frames per rendered frame: 1 = 2x, 2 = 3x, 3 = 4x
r.Streamline.DLSSG.FramesToGenerate=1
; Reflex: 0 off, 1 low latency, 2 low latency with boost
t.Streamline.Reflex.Mode=1
; DLSS super resolution model: 0 the game's own choice (CNN), 1 to 6 = A to F (CNN), 10 = J, 11 = K (transformer),
; 12 = L, 13 = M (second generation transformer, needs DLSS 310.5 or newer in place of the 310.2.1 the game ships)
r.NGX.DLSS.Preset=0
; RTX Dynamic Vibrance (DeepDVC): an AI colour filter the game ships but never exposes. Loaded at startup
; by r.Streamline.Load.DeepDVC in Engine.ini. Intensity 0 to 1 (0 = off), SaturationBoost 0 to 1 bites once intensity is high.
r.Streamline.DeepDVC.Enable=1
r.Streamline.DeepDVC.Intensity=0
r.Streamline.DeepDVC.SaturationBoost=0.5

[Adaptive]
; Picks the multiplier (off, 2x, 3x, 4x) once a second so base frame rate times multiplier reaches TargetFps.
; While on, the two DLSSG values above are ignored. Turning it off keeps the multiplier it reached.
Enabled=0
; A number, or auto: the monitor's refresh rate kept inside its G-Sync range (240 Hz gives 224).
TargetFps=auto
; With TargetFps=auto: auto uses refresh minus refresh squared over 3600, a number is subtracted instead.
RefreshMargin=auto
; Seconds a multiplier is kept before the controller reconsiders
HoldSeconds=3
; Seconds between attempts to step down when the output already meets the target. 0 disables probing.
ProbeSeconds=10

[FOV]
; Horizontal field of view per camera view, 40 to 130 degrees. 0 keeps the game's own dynamic value.
; HUD is first person without the cockpit. Applies live, no restart needed.
Cockpit=0
HUD=0
ThirdPerson=0

[Keys]
; Menu opens and closes the in-game menu, which holds every setting in this file.
; The rest are optional quick keys for use without opening it. They start out unset.
; All of them can also be picked in the menu, under Keys.
; Key names: F1..F24, A..Z, ZERO..NINE, NUM_ZERO..NUM_NINE, HOME, END, INS, DEL, PAGE_UP, PAGE_DOWN,
; OEM_PLUS and OEM_MINUS for the main-row = and - keys. Prefix with CTRL+, SHIFT+ or ALT+. Empty means no key.
Menu=F10
; Steps through off, 2x, 3x, 4x
CycleFrameGeneration=
ToggleAdaptive=
; Steps through off, low latency, boost
CycleReflex=
; Steps through the DLSS models: default, A to F, J to M
CycleDlssModel=
; Move the field of view of the view you are in by 5 degrees
FovUp=
FovDown=

[Menu]
; 0 turns the in-game menu off entirely. The quick keys above then work as they are set here
; when the game starts, and this file is the way to change everything else.
Enabled=1
; How the menu is drawn on an HDR screen: auto follows the game's HDR setting, on and off force it.
Hdr=auto
; Brightness of the menu in HDR, in nits
Nits=200
; A small always-on readout in the top-right corner: render and generated frame rate, and the DLSS model.
Overlay=0
