; Startup settings for offline sessions started by ac8tweaks.
; Copied over the game's Engine.ini when a session starts. The original is put back when the game exits.
; Only startup-only variables need to live here. Runtime values come from settings.ini once the mod is up.

[ConsoleVariables]
r.Streamline.InitializePlugin=1
r.Streamline.DLSSG.Enable=1
r.Streamline.DLSSG.FramesToGenerate=1
t.Streamline.Reflex.Mode=1
